name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Verify (Node 24 LTS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Deterministic dependency install
        run: npm ci --ignore-scripts

      - name: High-severity dependency audit
        run: npm audit --audit-level=high

      - name: Source safety lint
        run: npm run lint

      - name: Strict TypeScript typecheck
        run: npm run typecheck

      - name: Architecture and safety invariant tests
        run: npm test

      - name: Production Vite build
        run: npm run build

      - name: Production release smoke
        run: npm run release:smoke

      - name: Real browser render smoke
        timeout-minutes: 1
        run: npm run browser:smoke

      - name: Real browser offline restart and reconnect acceptance
        timeout-minutes: 1
        run: npm run offline:acceptance
